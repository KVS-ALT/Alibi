# One service hosts all generated project URLs; no per-project builds.
services:
  - type: web
    name: alibi-projects
    runtime: node
    plan: free
    region: oregon
    repo: https://github.com/KVS-ALT/Alibi
    branch: feature/render-project-apps
    buildCommand: npm ci --include=dev && npm run build:web
    startCommand: npm run start -w web -- --hostname 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22.20.0
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: '1'
      - key: LIVE_PROVIDER_CALLS_ENABLED
        value: 'false'
      - key: TEAM_LIVE_TEST_ENABLED
        value: 'false'
# Add DATABASE_URL to persist portfolios across restarts. Without it,
# generated portfolios use the existing single-process memory store.
