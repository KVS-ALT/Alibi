# Web service + Postgres. The Workflows service (workflow/) is created separately in the dashboard.
services:
  - type: web
    name: alibi
    runtime: node
    plan: starter # keep it paid so it never cold-starts during the demo
    buildCommand: npm ci && npm run build:web
    startCommand: npm run start:web
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: alibi-db
          property: connectionString
      - key: RENDER_API_KEY
        sync: false
      - key: WORKFLOW_SLUG
        value: alibi-workflow
      - key: ELEVENLABS_API_KEY
        sync: false

databases:
  - name: alibi-db
    plan: basic-256mb
